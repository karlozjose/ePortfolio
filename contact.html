<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" media="screen" href="style.css">
    
    <title>Carlos J. Malave - Electrical Engineer</title>

</head>

<body>
    <header>
        <h1>Contact Me</h1>
        <nav>
            <ul>
                <li class="color-box"><a href="index.html"> Back to Engineering</a></li>

            </ul>

        </nav>
    </header>

    <div class="container">
        <main>
            <section id="contact">
                <h2>Contact Me</h2>
                <p>You can reach me with the form below. Just sent me anything!</p>
                <!-- add a contact form -->
                <form action="https://formsubmit.co/el/libeje" method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="_captcha" value="false">
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required><br>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required><br><br>
                    <label for="message">Your message:</label><br>
                    <textarea id="message" name="message" rows ="5" cols ="22" required></textarea><br><br>
                    <button type="submit">Submit</button>
                </form>
            </section>

        </main>
    </div>
</body>


<script src="script.js"></script>
